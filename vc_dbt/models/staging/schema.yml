version: 2

models:
  - name: stg_sec_financials
    description: "Annual 10-K filings per company from SEC EDGAR XBRL API"
    columns:
      - name: ticker
        tests: [not_null]
      - name: fiscal_year
        tests: [not_null]
      - name: revenue
        tests: [not_null]

  - name: stg_sec_quarterly
    description: "Quarterly 10-Q YTD filings per company from SEC EDGAR XBRL API"
    columns:
      - name: ticker
        tests: [not_null]
      - name: fiscal_year
        tests: [not_null]
      - name: period
        tests: [not_null]
